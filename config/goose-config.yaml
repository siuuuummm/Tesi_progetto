extensions:
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
    available_tools: []
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
    available_tools: []
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
    available_tools: []
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
    available_tools: []
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
    available_tools: []
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
    available_tools: []
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
    available_tools: []
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
    available_tools: []
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
    available_tools: []
  ghidra-mcp:
    enabled: true
    type: stdio
    name: ghidra-mcp
    description: ghidra server mcp
    cmd: python3
    args:
    - /home/pippo/Desktop/Universita/Tesi/GhidraMCP-release-1-4/bridge_mcp_ghidra.py
    - --transport
    - stdio
    envs: {}
    env_keys: []
    timeout: 1300
    bundled: null
    available_tools: []
GOOSE_PROVIDER: custom_unsloth
GOOSE_MODEL: empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF
GOOSE_TELEMETRY_ENABLED: true
OPENROUTER_HOST: https://openrouter.ai
GOOGLE_HOST: https://generativelanguage.googleapis.com
GEMINI3_THINKING_LEVEL: high
CLAUDE_THINKING_TYPE: enabled
CLAUDE_THINKING_BUDGET: 16000
OPENAI_HOST: https://coal-straight-ranger-epson.trycloudflare.com
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_TIMEOUT: '600'
